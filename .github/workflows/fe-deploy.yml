name: CI/CD pipeline for WeTube Frontend Service

on:
  push:
    branches: [ feature/Deploy-to-aws ]

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Đặt tên image, ví dụ: your-username/wetube-frontend:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wetube-client-app:latest
          build-args: |
            # Truyền secret vào build-time argument đã khai báo trong Dockerfile
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
